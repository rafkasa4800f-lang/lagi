<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Demo API Tulis di Buku</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 30px auto; padding: 0 16px; }
  textarea { width: 100%; height: 140px; font-size: 15px; padding: 8px; box-sizing: border-box; }
  button { padding: 10px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }
  img { max-width: 100%; margin-top: 16px; border: 1px solid #ddd; }
  small { color: #666; }
</style>
</head>
<body>
  <h2>Demo: Nulis Otomatis di Buku</h2>
  <p><small>Pakai <code>\n</code> atau tekan Enter untuk pindah baris.</small></p>
  <label for="canvas">Pilih buku:</label>
  <select id="canvas">
    <option value="1">Canvas 1</option>
    <option value="2">Canvas 2</option>
  </select>
  <br /><br />
  <textarea id="text" placeholder="Contoh: opik yang foto ini coba lagi nanti&#10;baris kedua&#10;baris ketiga"></textarea>
  <br />
  <button onclick="generate()">Generate</button>
  <div id="result"></div>

<script>
async function generate() {
  const text = document.getElementById('text').value;
  const canvas = document.getElementById('canvas').value;
  const res = await fetch('/api/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, canvas: Number(canvas) })
  });
  if (!res.ok) {
    const err = await res.json();
    document.getElementById('result').innerHTML = '<p style="color:red">Error: ' + err.error + '</p>';
    return;
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  document.getElementById('result').innerHTML = '<img src="' + url + '" alt="hasil" />';
}
</script>
</body>
</html>
